name: scratch-rescue windows verify

# Purpose: run PR #134173's own scratch suites on a real Windows host — the one platform the local
# verification (macOS + Linux) could not cover. Side branch only; the PR head is untouched.

on:
  workflow_dispatch:
  push:
    branches: [ ci/scratch-windows-verify ]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the PR head
        uses: actions/checkout@v4
        with:
          ref: feat/scratch-prune-f1-rescue
          fetch-depth: 0

      - name: Show the head under test
        run: git log -1 --format='%H %s'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps (pytest + the config layer the suite imports)
        run: python -m pip install --quiet --disable-pip-version-check pytest ruamel.yaml

      - name: Run the scratch suites (the PR's own tests) on Windows
        run: python -m pytest tests/test_scratch_dir.py tests/test_scratch_scan_failures.py -v
